services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "1935:1935"
      - "8189:8189/udp"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9997/v3/config/global/get || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  api:
    build: ./api
    container_name: var_api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - MEDIA_HOST=${MEDIA_HOST:-localhost}
      - VENUE_ID=${VENUE_ID:-playground-hcm-01}
      - FIELD_ID=${FIELD_ID:-court-1}
      - RECORDING_TTL_HOURS=${RECORDING_TTL_HOURS:-2}
      - VALUES_PATH=/values.yml
      - MEDIAMTX_API_URL=http://mediamtx:9997
    volumes:
      - ./data/meta:/data/meta
      - ./data/recordings:/data/recordings:ro
      - ./data/clips:/data/clips
      - ./values.yml:/values.yml:ro
    depends_on:
      - mediamtx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  viewer:
    image: nginx:alpine
    container_name: var_viewer
    ports:
      - "8081:80"
    volumes:
      - ./viewer:/usr/share/nginx/html:ro
      - ./viewer/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"

  screen:
    image: nginx:alpine
    container_name: var_screen
    ports:
      - "8082:80"
    volumes:
      - ./screen:/usr/share/nginx/html:ro
      - ./screen/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"

  recorder:
    image: linuxserver/ffmpeg:latest
    container_name: var_recorder
    depends_on:
      - mediamtx
    env_file:
      - path: .env
        required: false
    environment:
      - VENUE_ID=${VENUE_ID:-playground-hcm-01}
      - FIELD_ID=${FIELD_ID:-court-1}
      - DEFAULT_CAMERAS=${DEFAULT_CAMERAS:-court1_camA court1_camB court1_camC court1_camD}
    volumes:
      - ./recorder:/recorder:ro
      - ./data/recordings:/data/recordings
      - ./values.yml:/values.yml:ro
    entrypoint: ["/bin/sh", "/recorder/record.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x ffmpeg || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
