app:
  name: "var-basic"
  env: "dev" # dev | staging | prod
  timezone: "Asia/Ho_Chi_Minh"
  logLevel: "info" # debug | info | warn | error

api:
  host: "0.0.0.0"
  port: 8000

viewer:
  publicBase: "http://edge.local" # used to generate QR URLs

deployment:
  locationId: "playground-hcm-01" # venue/site id
  venueName: "Playground Pickleball"
  edgeNodeId: "edge-01" # the mini-pc/nvr device id
  fieldCount: 2
  defaultFieldId: "court-1"

network:
  domain: "var.local" # or your public domain
  httpPort: 8080
  https: false
  cors:
    enabled: true
    allowOrigins:
      - "*"
  qr:
    enabled: true
    baseUrl: "https://var.app"
    pathTemplate: "/f/{sessionId}"

access:
  mode: "qr-only" # qr-only | public | private
  screen_pin: null  # set to e.g. "1234" to require PIN on courtside screen
  idLength: 12
  sessionExpiryHours: 72
  searchable: false
  session:
    type: "field"
    idLength: 8
    rotateOnRestart: false
    rotateOnMatchEnd: false

security:
  auth:
    enabled: false
  tokens:
    replayControlRequired: false

ui:
  screen:
    enabled: true
    defaultLayout: "single"
    allowCameraSwitch: true
    showTimeline: true
    replayButtonsSeconds: [5, 10, 15]
    slowMotionRates: [0.25, 0.5, 1.0]
    clip:
      enabled: true
      defaultClipSeconds: 10
      maxClipSeconds: 60
  web:
    enabled: true
    mode: "view"
    allowClips: true
    allowDownload: true
  mobile:
    enabled: true
    webAppFirst: true

fields:
  - fieldId: "court-1"
    name: "Court 1"
    cameras:
      - cameraId: "court1_camA"
        name: "Baseline A"
        position: "baseline-a"
        stream:
          type: "rtsp"
          url: "rtsp://user:pass@192.168.1.101:554/stream1"
          fps: 30
          resolution: "1920x1080"
        sync:
          enabled: true
          timeSource: "ntp"
      - cameraId: "court1_camB"
        name: "Baseline B"
        position: "baseline-b"
        stream:
          type: "rtsp"
          url: "rtsp://user:pass@192.168.1.102:554/stream1"
          fps: 30
          resolution: "1920x1080"
        sync:
          enabled: true
          timeSource: "ntp"
      - cameraId: "court1_camC"
        name: "Side A"
        position: "side-a"
        stream:
          type: "rtsp"
          url: "rtsp://user:pass@192.168.1.103:554/stream1"
          fps: 30
          resolution: "1920x1080"
        sync:
          enabled: true
          timeSource: "ntp"
      - cameraId: "court1_camD"
        name: "Side B"
        position: "side-b"
        stream:
          type: "rtsp"
          url: "rtsp://user:pass@192.168.1.104:554/stream1"
          fps: 30
          resolution: "1920x1080"
        sync:
          enabled: true
          timeSource: "ntp"
    replay:
      bufferSeconds: 60
      defaultReplaySeconds: 10
    recording:
      enabled: true
      mode: "continuous"
      splitMinutes: 5
    storagePolicy:
      keepFullMatchDays: 7
      keepClipsDays: 180
      autoDeleteEnabled: true

  - fieldId: "court-2"
    name: "Court 2"
    cameras:
      - cameraId: "court2_camA"
        name: "Baseline A"
        position: "baseline-a"
        stream:
          type: "rtsp"
          url: "rtsp://user:pass@192.168.1.105:554/stream1"
          fps: 30
          resolution: "1920x1080"
        sync:
          enabled: true
          timeSource: "ntp"
      - cameraId: "court2_camB"
        name: "Baseline B"
        position: "baseline-b"
        stream:
          type: "rtsp"
          url: "rtsp://user:pass@192.168.1.106:554/stream1"
          fps: 30
          resolution: "1920x1080"
        sync:
          enabled: true
          timeSource: "ntp"
    replay:
      bufferSeconds: 60
      defaultReplaySeconds: 10
    recording:
      enabled: true
      mode: "continuous"
      splitMinutes: 5
    storagePolicy:
      keepFullMatchDays: 7
      keepClipsDays: 180
      autoDeleteEnabled: true

streaming:
  enabled: true
  protocol: "hls"
  viewerLimits:
    perFieldMaxViewers: 200
  social:
    enabled: false
    outputs:
      - platform: "youtube"
        enabled: false
        rtmpUrl: ""

storage:
  mode: "edge"
  edge:
    basePath: "/data"
    maxDiskGb: 800
  cloud:
    provider: "s3"
    bucket: ""
    region: ""
    uploadClipsOnly: true

metadata:
  enabled: true
  db:
    type: "sqlite"
    path: "/data/meta/meta.db"
  events:
    logReplayClicks: true
    logCameraSwitches: true
    logClipCreates: true
    logStreamStarts: true
    logErrors: true

futureAiHooks:
  enabled: true
  cameraCalibration:
    required: false
    storeIntrinsics: true
    storeExtrinsics: true
  courtGeometry:
    storeLineCoordinates: true
  annotation:
    enabled: true
    simpleTags: ["in", "out", "fault", "unknown"]
    requireTagOnReplay: false
