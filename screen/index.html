<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VAR Basic Screen</title>
    <style>
      body {
        margin: 0;
        background: #0f1115;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      .app {
        max-width: 1400px;
        margin: 0 auto;
        padding: 16px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        gap: 12px;
        flex-wrap: wrap;
      }

      .title {
        font-size: 24px;
        font-weight: 700;
      }

      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: #1c212b;
        font-weight: 700;
        user-select: none;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #888;
      }

      .dot.live {
        background: #ff2b2b;
        box-shadow: 0 0 10px rgba(255, 43, 43, 0.7);
      }

      .player-wrap {
        background: #000;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }

      video {
        width: 100%;
        display: block;
        background: #000;
        max-height: 72vh;
      }

      .controls {
        margin-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        background: #222937;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #2d3648;
      }

      button.primary {
        background: #2e7dff;
      }

      button.live {
        background: #c62828;
      }

      button.active-cam {
        outline: 2px solid #7fb3ff;
        background: #31405d;
      }

      .timeline-wrap {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      input[type="range"] {
        width: 100%;
      }

      .timeline-labels {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: #b8c0cc;
      }

      .status {
        font-size: 13px;
        color: #b8c0cc;
      }

      .row-label {
        font-size: 13px;
        color: #b8c0cc;
        white-space: nowrap;
      }

      button.active-dur {
        outline: 2px solid #7fb3ff;
        background: #31405d;
      }

      #qr-section {
        display: none;
        align-items: center;
        gap: 12px;
        padding: 10px;
        background: #1c212b;
        border-radius: 12px;
      }

      #qr-url {
        font-size: 11px;
        color: #b8c0cc;
        word-break: break-all;
        max-width: 240px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="title" id="screenTitle">Court Screen</div>
        <div class="live-badge" id="liveBadge">
          <span class="dot" id="liveDot"></span>
          <span id="liveText">LIVE</span>
        </div>
      </div>

      <div class="player-wrap">
        <video id="player" controls playsinline webkit-playsinline></video>
      </div>

      <div class="controls">
        <div class="timeline-wrap">
          <input
            id="timeline"
            type="range"
            min="-60"
            max="0"
            step="1"
            value="0"
          />
          <div class="timeline-labels">
            <span>-60s</span>
            <span id="timelineCurrent">LIVE</span>
          </div>
        </div>

        <div class="row">
          <button id="back5">-5s</button>
          <button id="forward5">+5s</button>
          <button id="goLive" class="live">Go Live</button>
          <button id="clipBtn" class="primary">Clip</button>
        </div>

        <div class="row">
          <span class="row-label">Clip duration:</span>
          <button class="dur-btn" data-dur="5">5s</button>
          <button class="dur-btn active-dur" data-dur="10">10s</button>
          <button class="dur-btn" data-dur="15">15s</button>
          <button class="dur-btn" data-dur="30">30s</button>
        </div>

        <div class="row">
          <button class="cam-btn active-cam" data-cam="court1_camA">
            Cam A
          </button>
          <button class="cam-btn" data-cam="court1_camB">Cam B</button>
          <button class="cam-btn" data-cam="court1_camC">Cam C</button>
          <button class="cam-btn" data-cam="court1_camD">Cam D</button>
        </div>

        <div class="status" id="status">Starting…</div>

        <div id="qr-section">
          <canvas id="qr-canvas"></canvas>
          <div>
            <div class="status">Scan to watch on phone:</div>
            <div id="qr-url"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
