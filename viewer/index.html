<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Court Viewer</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, Arial, sans-serif;
        background: #f8f7f4;
        color: #1a1a18;
      }

      .wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 16px;
      }

      /* ── Header ─────────────────────────────────────────────────────────── */

      .venue-label {
        font-size: 12px;
        color: #888780;
        margin-bottom: 4px;
      }

      .session-title {
        font-size: 18px;
        font-weight: 500;
        color: #1a1a18;
        margin: 0 0 8px 0;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        min-height: 28px;
      }

      /* ── Viewer count ───────────────────────────────────────────────────── */

      .viewer-count {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #555;
      }

      .dot-wrap {
        position: relative;
        width: 10px;
        height: 10px;
        flex-shrink: 0;
      }

      .dot-core {
        position: absolute;
        inset: 0;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #22c55e;
      }

      .dot-ring {
        position: absolute;
        inset: 0;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #22c55e;
        animation: pulse 2s ease-out infinite;
      }

      @keyframes pulse {
        0%   { opacity: 0.6; transform: scale(0.8); }
        100% { opacity: 0;   transform: scale(1.8); }
      }

      /* ── Share button ───────────────────────────────────────────────────── */

      .share-btn {
        position: relative;
        background: #fff;
        border: 0.5px solid #d3d1c7;
        border-radius: 99px;
        padding: 5px 12px;
        font-size: 12px;
        color: #1a1a18;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .share-btn:hover { background: #f5f4f1; }

      .share-toast {
        display: none;
        position: absolute;
        bottom: calc(100% + 6px);
        right: 0;
        background: #1a1a18;
        color: #fff;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 6px;
        white-space: nowrap;
        pointer-events: none;
      }

      .share-toast.visible { display: block; }

      /* ── Video ──────────────────────────────────────────────────────────── */

      video {
        width: 100%;
        background: #000;
        border-radius: 10px;
        display: block;
      }

      .status {
        margin-top: 10px;
        font-size: 13px;
        color: #888780;
      }

      /* ── Clip section ───────────────────────────────────────────────────── */

      #clip-section {
        margin-top: 20px;
      }

      #clip-section h2 {
        font-size: 14px;
        font-weight: 500;
        color: #888780;
        margin: 0 0 10px 0;
      }

      .clip-scroll {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
      }

      .clip-scroll::-webkit-scrollbar { display: none; }

      .clip-card {
        width: 130px;
        flex-shrink: 0;
        background: #fff;
        border: 0.5px solid #e2ddd5;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
      }

      .clip-card:hover { border-color: #c8c4bd; }

      .clip-thumb {
        height: 72px;
        background: #1a1a18;
        border-radius: 8px 8px 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .clip-play {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 12px;
      }

      .clip-duration-badge {
        position: absolute;
        bottom: 5px;
        right: 6px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 10px;
        padding: 2px 5px;
        border-radius: 4px;
      }

      .clip-info {
        padding: 6px 8px;
      }

      .clip-cam {
        font-size: 11px;
        font-weight: 500;
        color: #1a1a18;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .clip-time {
        font-size: 10px;
        color: #888780;
        margin-top: 1px;
      }

      /* ── Bottom bar ─────────────────────────────────────────────────────── */

      .bottom-bar {
        margin-top: 24px;
        padding-top: 12px;
        border-top: 0.5px solid #e2ddd5;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .bottom-bar-left {
        font-size: 12px;
        color: #b5b2ab;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .stream-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #22c55e;
        flex-shrink: 0;
      }

      .bottom-bar-right {
        font-size: 10px;
        color: #c8c4bd;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="venue-label" id="venueLabel"></div>
      <div class="session-title" id="sessionTitle">Connecting...</div>

      <div class="meta-row">
        <div class="viewer-count" id="viewerCount" style="display:none">
          <div class="dot-wrap">
            <div class="dot-core"></div>
            <div class="dot-ring"></div>
          </div>
          <span id="viewerText">Just you</span>
        </div>
        <button class="share-btn" id="shareBtn" style="display:none">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          Share
          <span class="share-toast" id="shareToast">Link copied!</span>
        </button>
      </div>

      <video id="player" controls autoplay playsinline webkit-playsinline></video>
      <div class="status" id="status"></div>

      <div id="clip-section" style="display:none">
        <h2>Session Clips</h2>
        <div class="clip-scroll" id="clip-list"></div>
      </div>

      <div class="bottom-bar" id="bottomBar" style="display:none">
        <div class="bottom-bar-left">
          <div class="stream-dot"></div>
          Stream active
        </div>
        <div class="bottom-bar-right">VAR Basic</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
      const API_BASE = `http://${window.location.hostname}:8000/api`;

      function getSessionId() {
        const url = new URL(window.location.href);
        const queryId = url.searchParams.get("id");
        if (queryId) return queryId;
        const parts = url.pathname.split("/").filter(Boolean);
        if (parts.length >= 2 && parts[0] === "f") return parts[1];
        return null;
      }

      async function postEvent(sessionId, event, meta = {}) {
        try {
          await fetch(`${API_BASE}/event`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, event, meta }),
          });
        } catch { /* non-fatal */ }
      }

      async function joinSession(sessionId) {
        try {
          const res = await fetch(`${API_BASE}/session/${sessionId}/join`, { method: "POST" });
          if (res.ok) {
            const data = await res.json();
            return data.viewer_count;
          }
        } catch { /* non-fatal */ }
        return null;
      }

      async function leaveSession(sessionId) {
        try {
          await fetch(`${API_BASE}/session/${sessionId}/leave`, { method: "POST" });
        } catch { /* non-fatal */ }
      }

      async function loadClips(sessionId) {
        try {
          const res = await fetch(`${API_BASE}/clips?session_id=${sessionId}&limit=20`);
          if (!res.ok) return;
          const data = await res.json();
          const clips = data.clips || [];
          if (clips.length === 0) return;

          const section = document.getElementById("clip-section");
          const list = document.getElementById("clip-list");
          section.style.display = "";
          list.innerHTML = "";

          for (const clip of clips) {
            const card = document.createElement("div");
            card.className = "clip-card";
            const date = new Date(clip.created_at * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            card.innerHTML = `
              <div class="clip-thumb">
                <div class="clip-play">&#9654;</div>
                <div class="clip-duration-badge">${clip.duration_sec}s</div>
              </div>
              <div class="clip-info">
                <div class="clip-cam">${clip.camera_id}</div>
                <div class="clip-time">${date}</div>
              </div>
            `;
            card.addEventListener("click", () => window.open(clip.clip_url, "_blank"));
            list.appendChild(card);
          }
        } catch { /* non-fatal */ }
      }

      async function shareSession(url, title) {
        if (navigator.share) {
          await navigator.share({ title, url });
        } else {
          await navigator.clipboard.writeText(url);
          const toast = document.getElementById("shareToast");
          toast.classList.add("visible");
          setTimeout(() => toast.classList.remove("visible"), 2000);
        }
      }

      async function start() {
        const sessionId = getSessionId();
        const titleEl = document.getElementById("sessionTitle");
        const venueLabelEl = document.getElementById("venueLabel");
        const statusEl = document.getElementById("status");
        const video = document.getElementById("player");
        const viewerCountEl = document.getElementById("viewerCount");
        const viewerTextEl = document.getElementById("viewerText");
        const shareBtnEl = document.getElementById("shareBtn");
        const bottomBar = document.getElementById("bottomBar");

        if (!sessionId) {
          titleEl.textContent = "Missing session ID";
          statusEl.textContent = "Open this page with ?id=YOUR_SESSION_ID";
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/session/${sessionId}`);
          if (!res.ok) throw new Error(`Session not found (${res.status})`);

          const data = await res.json();

          const fieldLabel = data.field_name || data.field_id;
          const venueLabel = data.venue_name || "";

          venueLabelEl.textContent = venueLabel ? `${venueLabel} · ${fieldLabel}` : fieldLabel;
          titleEl.textContent = `Live match — ${fieldLabel}`;

          // Join viewer counter
          const viewerCount = await joinSession(sessionId);

          if (viewerCount !== null) {
            viewerCountEl.style.display = "flex";
            viewerTextEl.textContent = viewerCount <= 1 ? "Just you" : `${viewerCount} watching`;
          }

          // Share button
          const shareUrl = window.location.href;
          const shareTitle = venueLabel ? `${venueLabel} · ${fieldLabel}` : fieldLabel;
          shareBtnEl.style.display = "inline-flex";
          shareBtnEl.addEventListener("click", () => shareSession(shareUrl, shareTitle));

          // Bottom bar
          bottomBar.style.display = "";

          // HLS
          const hlsUrl = `http://${window.location.hostname}:8888/${data.stream_path}/index.m3u8`;
          let reconnectTimer = null;

          function startHls() {
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

            if (Hls.isSupported()) {
              const hls = new Hls({ lowLatencyMode: false });
              hls.loadSource(hlsUrl);
              hls.attachMedia(video);
              hls.on(Hls.Events.MANIFEST_PARSED, async () => {
                try {
                  await video.play();
                  statusEl.textContent = "Live stream playing";
                } catch {
                  statusEl.textContent = "Tap play to start stream";
                }
              });
              hls.on(Hls.Events.ERROR, (_, eventData) => {
                if (eventData.fatal) {
                  hls.destroy();
                  statusEl.textContent = "Stream lost. Reconnecting in 5s...";
                  reconnectTimer = setTimeout(startHls, 5000);
                }
              });
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
              video.src = hlsUrl;
              video.addEventListener("loadedmetadata", async () => {
                try { await video.play(); } catch { statusEl.textContent = "Tap play to start"; }
              });
            } else {
              throw new Error("This browser does not support HLS");
            }
          }

          startHls();

          await loadClips(sessionId);
          await postEvent(sessionId, "open", { userAgent: navigator.userAgent });

          window.addEventListener("beforeunload", () => {
            leaveSession(sessionId);
            navigator.sendBeacon(
              `${API_BASE}/event`,
              new Blob(
                [JSON.stringify({ session_id: sessionId, event: "close", meta: {} })],
                { type: "application/json" },
              ),
            );
          });
        } catch (err) {
          console.error(err);
          titleEl.textContent = "Could not connect";
          statusEl.textContent = err.message;
        }
      }

      start();
    </script>
  </body>
</html>
