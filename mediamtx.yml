logLevel: info

hls: yes
hlsAlwaysRemux: yes
hlsSegmentDuration: 2s
hlsPartDuration: 200ms
hlsSegmentCount: 30

# API for health/status checks (used by /api/health/detailed and camera status)
api: yes
apiAddress: :9997

# Wildcard path — accepts any camera stream without pre-registration
paths:
  "~.*": {}
